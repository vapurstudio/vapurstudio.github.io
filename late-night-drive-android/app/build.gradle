plugins { id 'com.android.application' }

android {
    namespace 'com.vapurstudio.latenightdrive'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vapurstudio.latenightdrive'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'latenightdrive'
            keyAlias 'lnd'
            keyPassword 'latenightdrive'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (file('../release.keystore').exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['mp3', 'ogg', 'wav', 'm4a'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
